<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141b18" />
  <title>VMI-002 — Monophonic Synth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500&display=swap" />
  <link rel="stylesheet" type="text/css" href="style.css" />
  <script src="libraries/p5.js"></script>
  <script src="libraries/p5.sound.js"></script>
</head>

<body>
  <div class="app" id="app">
    <header class="bar">
      <div class="brand">
        <span class="mark">VMI-002</span>
        <h1>Mono<span class="long">phonic </span>Synth</h1>
      </div>
      <div class="bar-actions">
        <span class="clip" id="clip" aria-live="polite" hidden>Clip</span>
        <button type="button" id="power" class="btn btn-primary">Start audio</button>
        <button type="button" id="keys-toggle" class="btn" aria-expanded="false">Play keys</button>
      </div>
    </header>

    <div class="scope" id="scope"></div>

    <main class="panels">
      <section class="panel">
        <h2>Voice</h2>
        <div class="field">
          <label>Waveform</label>
          <div class="segmented" id="wave-seg" role="group" aria-label="Waveform"></div>
        </div>
        <div class="field">
          <label>Scale</label>
          <div class="segmented" id="scale-seg" role="group" aria-label="Scale"></div>
        </div>
        <div class="field">
          <label for="octave">Octave</label>
          <span class="value" id="octave-out">0</span>
          <div class="stepper">
            <button type="button" id="oct-down" aria-label="Octave down">&minus;</button>
            <button type="button" id="oct-up" aria-label="Octave up">+</button>
          </div>
        </div>
        <div class="field">
          <label for="detune">Detune</label><span class="value" id="detune-out"></span>
          <input type="range" id="detune" min="-50" max="50" step="1" value="0" />
        </div>
      </section>

      <section class="panel">
        <h2>Filter</h2>
        <div class="field">
          <label>Type</label>
          <div class="segmented" id="filter-seg" role="group" aria-label="Filter type"></div>
        </div>
        <div class="field">
          <label for="cutoff">Cutoff</label><span class="value" id="cutoff-out"></span>
          <input type="range" id="cutoff" min="80" max="16000" step="10" value="16000" />
        </div>
        <div class="field">
          <label for="res">Resonance</label><span class="value" id="res-out"></span>
          <input type="range" id="res" min="0" max="20" step="0.1" value="1" />
        </div>
      </section>

      <section class="panel">
        <h2>Envelope</h2>
        <div class="field">
          <label for="attack">Attack</label><span class="value" id="attack-out"></span>
          <input type="range" id="attack" min="0.005" max="1" step="0.001" value="0.01" />
        </div>
        <div class="field">
          <label for="decay">Decay</label><span class="value" id="decay-out"></span>
          <input type="range" id="decay" min="0.1" max="3" step="0.01" value="0.3" />
        </div>
        <div class="field">
          <label for="sustain">Sustain</label><span class="value" id="sustain-out"></span>
          <input type="range" id="sustain" min="0.1" max="1" step="0.01" value="0.3" />
        </div>
        <div class="field">
          <label for="release">Release</label><span class="value" id="release-out"></span>
          <input type="range" id="release" min="0.03" max="3" step="0.01" value="0.2" />
        </div>
      </section>

      <section class="panel">
        <h2>Space</h2>
        <div class="field">
          <label for="reverb">Reverb mix</label><span class="value" id="reverb-out"></span>
          <input type="range" id="reverb" min="0" max="1" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="delay">Delay mix</label><span class="value" id="delay-out"></span>
          <input type="range" id="delay" min="0" max="1" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="delay-div">Delay time</label><span class="value" id="delay-div-out"></span>
          <input type="range" id="delay-div" min="0" max="7" step="1" value="5" />
        </div>
        <div class="field">
          <label for="reverb-time">Reverb time</label><span class="value" id="reverb-time-out"></span>
          <input type="range" id="reverb-time" min="0.5" max="10" step="0.1" value="3" />
        </div>
        <div class="field">
          <label for="delay-fb">Delay feedback</label><span class="value" id="delay-fb-out"></span>
          <input type="range" id="delay-fb" min="0" max="0.9" step="0.01" value="0.7" />
        </div>
        <div class="field">
          <label for="drive">Distortion</label><span class="value" id="drive-out"></span>
          <input type="range" id="drive" min="0" max="1" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="drive-amt">Drive amount</label><span class="value" id="drive-amt-out"></span>
          <input type="range" id="drive-amt" min="0" max="1" step="0.01" value="0.3" />
        </div>
      </section>

      <section class="panel">
        <h2>Noise</h2>
        <div class="field">
          <label>Colour</label>
          <div class="segmented" id="noise-seg" role="group" aria-label="Noise colour"></div>
        </div>
        <div class="field">
          <label for="noise-level">Level</label><span class="value" id="noise-level-out"></span>
          <input type="range" id="noise-level" min="0" max="0.03" step="0.0001" value="0.00001" />
        </div>
      </section>

      <section class="panel">
        <h2>Arpeggio</h2>
        <div class="field">
          <label for="tempo">Tempo</label><span class="value" id="tempo-out"></span>
          <input type="range" id="tempo" min="40" max="200" step="1" value="90" />
        </div>
        <div class="field">
          <button type="button" id="loop-toggle" class="btn btn-wide" aria-pressed="false">Start loop</button>
        </div>
        <div class="field">
          <label for="chord">Chord</label><span class="value" id="chord-out"></span>
          <input type="range" id="chord" min="0" max="6" step="1" value="0" />
        </div>
        <div class="field">
          <label for="loop-delay">Loop mix</label><span class="value" id="loop-delay-out"></span>
          <input type="range" id="loop-delay" min="0" max="1" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="loop-div">Loop time</label><span class="value" id="loop-div-out"></span>
          <input type="range" id="loop-div" min="0" max="7" step="1" value="3" />
        </div>
      </section>

      <section class="panel">
        <h2>Saturate</h2>
        <div class="field">
          <label for="sat-low">Low</label><span class="value" id="sat-low-out"></span>
          <input type="range" id="sat-low" min="0" max="1" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="sat-high">High</label><span class="value" id="sat-high-out"></span>
          <input type="range" id="sat-high" min="0" max="1" step="0.01" value="0" />
        </div>
      </section>

      <section class="panel">
        <h2>Master</h2>
        <div class="field">
          <label for="volume">Volume</label><span class="value" id="volume-out"></span>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
        </div>
      </section>
    </main>

    <div class="dock" id="dock" aria-hidden="true">
      <div class="key-row" id="row-up" data-tone="var(--cool)"></div>
      <div class="key-row" id="row-base" data-tone="var(--amber)"></div>
      <div class="key-row" id="row-down" data-tone="var(--ember)"></div>
      <p class="dock-hint">Tap the keys, or play the matching letters on a physical keyboard</p>
    </div>
  </div>

  <script src="knob.js"></script>
  <script src="saturator.js"></script>
  <script src="sketch.js"></script>
</body>

</html>
